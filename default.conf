server {
    listen 80;

    root /var/www/html/public;
    index index.php index.html;

    # Laravel logs its own errors; keep nginx's own logs but don't duplicate noise.
    access_log /tmp/nginx-logs/access.log;
    error_log  /tmp/nginx-logs/error.log warn;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Cache static assets aggressively; Laravel's public assets are typically
    # fingerprinted (via Vite/Mix) so long cache lifetimes are safe.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Block dotfiles (.env, .git, .htaccess, etc.), not just .ht*
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

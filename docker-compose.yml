x-app-common: &app-common
    build:
        context: .
        dockerfile: Dockerfile
    env_file:
        - .env
    environment: &app-env
        DB_HOST: db
        DB_PORT: "5432"
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        JUDGE_REDIS_URL: redis://redis:6379/0
    entrypoint:
        - /usr/local/bin/docker-entrypoint.sh
    volumes:
        - ./:/var/www/html
        - vendor:/var/www/html/vendor
        - storage:/var/www/html/storage
        - bootstrap_cache:/var/www/html/bootstrap/cache
        - /var/run/docker.sock:/var/run/docker.sock
    networks:
        - app-network
    depends_on:
        db:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    redis:
        image: redis:7-alpine
        container_name: laravel-redis
        expose:
            - "6379"
        networks:
            - app-network
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    db:
        image: postgres:14-alpine
        container_name: postgres-db
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        expose:
            - "5432"
        networks:
            - app-network
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5

    laravel:
        <<: *app-common
        container_name: laravel-app
        ports:
            - "8000:80"
        tmpfs:
            - /tmp:size=128M
        command: >
            sh -c "php artisan migrate --force &&
                   php artisan db:seed --class=CountrySeeder --force &&
                   php-fpm --fpm-config /usr/local/etc/php-fpm.conf --daemonize &&
                   nginx -g 'daemon off;'"

    queue-worker:
        <<: *app-common
        container_name: laravel-queue-worker
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            laravel:
                condition: service_started
        tmpfs:
            - /tmp:size=64M
        command: sh -c "php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600"

    judge-consumer:
        <<: *app-common
        container_name: judge-result-consumer
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            laravel:
                condition: service_started
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
            - bootstrap_cache:/var/www/html/bootstrap/cache
        tmpfs:
            - /tmp:size=64M
        command: sh -c "php artisan judge:worker"

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
    redis_data:
    vendor:
    storage:
    bootstrap_cache:

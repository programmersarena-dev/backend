version: "3.8"

services:
    # Redis Cache & Queue
    redis:
        image: redis:7-alpine
        container_name: laravel-redis
        ports:
            - "6379:6379"
        networks:
            - app-network
        volumes:
            - redis_data:/data

    # Laravel App (Web)
    laravel:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: laravel-app
        volumes:
            - ./:/var/www/html
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "8000:80"
        networks:
            - app-network
        depends_on:
            - db
            - redis
        env_file:
            - .env
        command: sh -c "mkdir -p /tmp/run/php && chown -R www-data:www-data /tmp/run /tmp/nginx-logs && php-fpm --fpm-config /usr/local/etc/php-fpm.conf --daemonize && nginx -g 'daemon off;'"

    # Laravel Queue Worker (for submission grading jobs to judge-box)
    queue-worker:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: laravel-queue-worker
        volumes:
            - ./:/var/www/html
            - ./storage/app/tmp:/var/www/html/storage/app/tmp
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - app-network
        depends_on:
            - db
            - redis
        env_file:
            - .env
        command: php /var/www/html/artisan queue:work redis --sleep=3 --tries=3

    # Judge Result Consumer (listens to judge:results queue from judge-box)
    judge-consumer:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: judge-result-consumer
        volumes:
            - ./:/var/www/html
        networks:
            - app-network
        depends_on:
            - db
            - redis
        env_file:
            - .env
        command: php /var/www/html/artisan judge:worker

    # PostgreSQL Database
    db:
        image: postgres:14
        container_name: postgres-db
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        networks:
            - app-network
        volumes:
            - pgdata:/var/lib/postgresql/data
        env_file:
            - .env

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
    redis_data:

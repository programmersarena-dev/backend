version: "3.8"

services:
    # Laravel App (Web)
    laravel:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: laravel-app
        volumes:
            - ./:/var/www/html
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "8000:80"
        networks:
            - app-network
        depends_on:
            - db
        env_file:
            - .env
        command: sh -c "mkdir -p /tmp/run/php && chown -R www-data:www-data /tmp/run /tmp/nginx-logs && php-fpm --fpm-config /usr/local/etc/php-fpm.conf --daemonize && nginx -g 'daemon off;'"

    # Laravel Queue Worker
    queue-worker:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: laravel-queue-worker
        volumes:
            - ./:/var/www/html
            - ./storage/app/tmp:/var/www/html/storage/app/tmp
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - app-network
        depends_on:
            - db
        env_file:
            - .env
        command: php /var/www/html/artisan queue:work --sleep=3 --tries=3

    # PostgreSQL Database
    db:
        image: postgres:14
        container_name: postgres-db
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        networks:
            - app-network
        volumes:
            - pgdata:/var/lib/postgresql/data
        env_file:
            - .env

    # React Frontend
    react:
        build:
            context: ./react
            dockerfile: Dockerfile
        container_name: react-app
        ports:
            - "3000:80"
        networks:
            - app-network
        depends_on:
            - laravel

    # Reverse Proxy (Optional but Recommended)
    proxy:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            react:
                condition: service_started
            laravel:
                condition: service_started
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:

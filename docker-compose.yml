services:
    redis:
        image: redis:7-alpine
        container_name: laravel-redis
        ports:
            - "6379:6379"
        networks:
            - app-network
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    db:
        image: postgres:14
        container_name: postgres-db
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        networks:
            - app-network
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5

    laravel:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-app
        env_file:
            - .env
        entrypoint:
            - /usr/local/bin/docker-entrypoint.sh
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
            - bootstrap_cache:/var/www/html/bootstrap/cache
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "8000:80"
        networks:
            - app-network
        depends_on:
            - db
            - redis
        restart: unless-stopped
        command: sh -c "php-fpm --fpm-config /usr/local/etc/php-fpm.conf --daemonize && nginx -g 'daemon off;'"

    queue-worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-queue-worker
        env_file:
            - .env
        entrypoint:
            - /usr/local/bin/docker-entrypoint.sh
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
            - bootstrap_cache:/var/www/html/bootstrap/cache
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - app-network
        depends_on:
            - db
            - redis
        restart: unless-stopped
        command: sh -c "php /var/www/html/artisan queue:work redis --sleep=3 --tries=3"

    judge-consumer:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: judge-result-consumer
        env_file:
            - .env
        entrypoint:
            - /usr/local/bin/docker-entrypoint.sh
        volumes:
            - ./:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
            - bootstrap_cache:/var/www/html/bootstrap/cache
        networks:
            - app-network
        depends_on:
            - db
            - redis
        restart: unless-stopped
        command: sh -c "php /var/www/html/artisan judge:worker"

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
    redis_data:
    vendor:
    storage:
    bootstrap_cache:
